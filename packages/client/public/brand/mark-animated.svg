<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="120" height="120">
  <title>Context</title>
  <style>
    .arc {
      fill: none;
      stroke: #1f1f1f;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 0;
      animation: draw 2800ms cubic-bezier(0.34, 1.26, 0.64, 1) infinite;
    }
    .arc:nth-of-type(2) { animation-delay: 180ms; }
    .arc:nth-of-type(3) { animation-delay: 360ms; }
    .dot {
      fill: #f05a2a;
      transform-box: fill-box;
      transform-origin: center;
      animation: pop 2800ms cubic-bezier(0.34, 1.26, 0.64, 1) infinite;
    }
    @keyframes draw {
      0% { stroke-dashoffset: 1; }
      22%, 92% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1; }
    }
    @keyframes pop {
      0%, 30% { transform: scale(0); opacity: 0; }
      44% { transform: scale(1.18); opacity: 1; }
      52%, 92% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .arc, .dot { animation: none; }
    }
  </style>
  <path class="arc" pathLength="1" d="M25.33 6.67A13.2 13.2 0 1 0 25.33 25.33" />
  <path class="arc" pathLength="1" d="M22.51 9.5A9.2 9.2 0 1 0 22.51 22.51" />
  <path class="arc" pathLength="1" d="M19.39 12.61A4.8 4.8 0 1 0 19.39 19.39" />
  <circle class="dot" cx="16" cy="16" r="2.1" />
</svg>
